<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de CausaOps</title>
  <desc id="d">Demo Payments envía telemetría a la API FastAPI, que guarda hechos en PostgreSQL. Un detector abre incidentes, la web en Next.js consulta la API y Groq devuelve diagnósticos validados contra la evidencia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0025"/>
      <stop offset="1" stop-color="#030014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#06b6d4"/>
    </marker>
    <style>
      .box{fill:rgba(255,255,255,0.05);stroke:rgba(255,255,255,0.18);stroke-width:1.5}
      .core{fill:rgba(124,58,237,0.22);stroke:#a855f7;stroke-width:2}
      .ai{fill:rgba(6,182,212,0.12);stroke:#06b6d4;stroke-width:1.5;stroke-dasharray:6 4}
      .name{font:700 22px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff}
      .sub{font:500 15px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#94a3b8}
      .lbl{font:600 14px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#c4b5fd}
      .lblc{font:600 14px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#67e8f9}
      .ln{stroke:#a855f7;stroke-width:2;fill:none}
      .lnc{stroke:#06b6d4;stroke-width:2;fill:none;stroke-dasharray:6 4}
      .hdr{font:600 15px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#a855f7;letter-spacing:2px}
      .chip{fill:rgba(255,255,255,0.06);stroke:rgba(255,255,255,0.12)}
      .chipt{font:500 13px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#cbd5e1}
    </style>
  </defs>

  <rect width="800" height="432" fill="url(#bg)"/>
  <rect width="800" height="432" fill="url(#glow)"/>

  <text x="40" y="58" class="hdr">CAUSAOPS · ARQUITECTURA</text>

  <!-- Fila 1 -->
  <rect x="40" y="96" width="200" height="76" rx="12" class="box"/>
  <text x="140" y="130" text-anchor="middle" class="name">Demo Payments</text>
  <text x="140" y="155" text-anchor="middle" class="sub">servicio demo</text>

  <rect x="300" y="96" width="200" height="76" rx="12" class="core"/>
  <text x="400" y="130" text-anchor="middle" class="name">API</text>
  <text x="400" y="155" text-anchor="middle" class="sub">FastAPI · Python</text>

  <rect x="560" y="96" width="200" height="76" rx="12" class="box"/>
  <text x="660" y="130" text-anchor="middle" class="name">PostgreSQL</text>
  <text x="660" y="155" text-anchor="middle" class="sub">SQLAlchemy</text>

  <!-- Fila 2 -->
  <rect x="40" y="276" width="200" height="76" rx="12" class="box"/>
  <text x="140" y="310" text-anchor="middle" class="name">Web</text>
  <text x="140" y="335" text-anchor="middle" class="sub">Next.js · TS</text>

  <rect x="300" y="276" width="200" height="76" rx="12" class="ai"/>
  <text x="400" y="310" text-anchor="middle" class="name">Groq LLM</text>
  <text x="400" y="335" text-anchor="middle" class="sub">diagnóstico</text>

  <rect x="560" y="276" width="200" height="76" rx="12" class="box"/>
  <text x="660" y="310" text-anchor="middle" class="name">Detector</text>
  <text x="660" y="335" text-anchor="middle" class="sub">reglas</text>

  <!-- Flechas -->
  <line x1="240" y1="134" x2="296" y2="134" class="ln" marker-end="url(#arr)"/>
  <text x="268" y="88" text-anchor="middle" class="lbl">telemetría</text>

  <line x1="500" y1="134" x2="556" y2="134" class="ln" marker-end="url(#arr)"/>
  <text x="528" y="88" text-anchor="middle" class="lbl">hechos</text>

  <path d="M240 300 L300 196" class="ln" marker-end="url(#arr)"/>
  <text x="196" y="236" text-anchor="middle" class="lbl">incidentes</text>

  <line x1="400" y1="172" x2="400" y2="272" class="lnc" marker-end="url(#arrc)" marker-start="url(#arrc)"/>
  <text x="412" y="216" class="lblc">evidencia →</text>
  <text x="412" y="236" class="lblc">JSON validado</text>

  <line x1="660" y1="276" x2="660" y2="176" class="ln" marker-end="url(#arr)"/>
  <text x="672" y="232" class="lbl">abre incidentes</text>

  <!-- Pie -->
  <rect x="40" y="380" width="176" height="30" rx="15" class="chip"/>
  <text x="128" y="400" text-anchor="middle" class="chipt">aprobación humana</text>
  <rect x="228" y="380" width="150" height="30" rx="15" class="chip"/>
  <text x="303" y="400" text-anchor="middle" class="chipt">Docker Compose</text>
  <rect x="390" y="380" width="96" height="30" rx="15" class="chip"/>
  <text x="438" y="400" text-anchor="middle" class="chipt">Alembic</text>
  <rect x="498" y="380" width="120" height="30" rx="15" class="chip"/>
  <text x="558" y="400" text-anchor="middle" class="chipt">CI · tests</text>
</svg>
